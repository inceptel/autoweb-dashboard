<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Autoweb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e14;--s1:#0f1318;--s2:#141820;--s3:#1a2030;
  --b1:#1e2535;--b2:#252d3d;
  --t1:#c8cdd8;--t2:#8892a4;--t3:#556070;
  --green:#4ade80;--gbg:rgba(74,222,128,0.1);
  --red:#f87171;--rbg:rgba(248,113,113,0.1);
  --yel:#fbbf24;--ybg:rgba(251,191,36,0.1);
  --blue:#60a5fa;--bbg:rgba(96,165,250,0.08);
  --feather:#818cf8;--nba:#fb923c;--cli2html:#22d3ee;--premere:#f472b6;--trading:#4ade80;--golf:#34d399;--ria:#e879f9;--cython:#facc15;--alpha:#38bdf8;--backtest:#fb7185;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;overflow:hidden}
.layout{display:flex;flex-direction:column;height:100%}
.hdr{padding:10px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--s1)}
.hdr-title{font-size:13px;font-weight:600;color:#e2e8f0;letter-spacing:.02em}
.hdr-meta{margin-left:auto;font-size:11px;color:var(--t3);display:flex;gap:14px;align-items:center}
.hdr-meta .run{color:var(--green);font-weight:600}
.sb-toggle{display:none;background:none;border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;padding:4px 8px;font-size:12px;line-height:1;flex-shrink:0}
.sb-toggle:hover{background:var(--s2);color:var(--t1)}
.body{display:flex;flex:1;overflow:hidden;min-height:0}
/* Sidebar */
.sb{width:280px;border-right:1px solid var(--b1);overflow-y:auto;flex-shrink:0}
.det-back{display:none;background:none;border:none;color:var(--t2);cursor:pointer;font-size:12px;padding:0;margin-right:4px;line-height:1}
.det-back:hover{color:var(--t1)}
@media(max-width:640px){
  .sb-toggle{display:inline-flex;align-items:center;gap:5px}
  .sb{width:100%;border-right:none}
  .body.sb-open .det{display:none}
  .body:not(.sb-open) .sb{display:none}
  .det-back{display:inline-flex;align-items:center;gap:4px}
}
.card{padding:10px 12px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s;border-left:2px solid transparent}
.card:hover{background:var(--s2)}
.card.on{background:var(--s3)}
.card.stopped{opacity:.72;transition:opacity .15s}.card.stopped:hover,.card.stopped.on{opacity:1}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.cn{font-weight:600;color:#e2e8f0;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.br{color:var(--green);background:var(--gbg)}
.bs{color:var(--t3);background:rgba(85,96,112,.12)}
.bk{color:var(--green);background:var(--gbg)}
.bv{color:var(--red);background:var(--rbg)}
.bc{color:var(--yel);background:var(--ybg)}
.bx{color:var(--t3);background:rgba(85,96,112,.1)}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;animation:p 2s infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}50%{box-shadow:0 0 0 3px transparent}}
.cs{display:flex;gap:8px;font-size:10px;color:var(--t3);align-items:center}
.cs .k{color:#4ade8088}.cs .r{color:#f8717188}.cs .c{color:#fbbf2488}
.cs .pct{font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;margin-left:auto}
.cc{margin-top:4px;font-size:11px;color:var(--t2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc.live{color:var(--yel)}
.sp{display:flex;gap:2px;margin-top:5px;align-items:center}
.sd{width:6px;height:6px;border-radius:1px;flex-shrink:0;opacity:.85}
.ms{margin-top:5px}
.ms-bar{height:2px;background:var(--b2);border-radius:1px;overflow:hidden;margin-bottom:2px}
.ms-fill{height:100%;border-radius:1px;transition:width .3s}
.ms-lbl{font-size:9px;color:var(--t3)}
/* Detail */
.det{flex:1;overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.dh{padding:11px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);z-index:10;flex-shrink:0}
.dt{font-size:14px;font-weight:600;color:#e2e8f0}
.dm{font-size:11px;color:var(--t3);margin-left:auto;display:flex;gap:10px;align-items:center}
.cur{padding:8px 16px;background:var(--s2);border-bottom:1px solid var(--b1);font-size:12px;color:var(--yel);line-height:1.4;display:none;flex-shrink:0}
.cur.on{display:block}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:49px;background:var(--bg);text-align:left;padding:6px 16px;font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--b1);z-index:5}
td{padding:7px 16px;border-bottom:1px solid var(--b1);vertical-align:top}
tr:hover td{background:var(--s2)}
.ts{font-family:ui-monospace,monospace;font-size:10px;color:var(--t3);white-space:nowrap;width:105px}
.sc{width:74px}
.desc{color:var(--t1);line-height:1.5;word-break:break-word;font-size:12px}
tr.row-k td:first-child{border-left:2px solid rgba(74,222,128,.3)}
tr.row-v td:first-child{border-left:2px solid rgba(248,113,113,.3)}
tr.row-c td:first-child{border-left:2px solid rgba(251,191,36,.3)}
tr.row-x td:first-child{border-left:2px solid rgba(85,96,112,.12)}
.empty{padding:32px 16px;color:var(--t3);text-align:center}
.ft-bar{display:flex;gap:4px;padding:7px 16px;border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap}
.ft{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t3);letter-spacing:.02em;transition:all .1s}
.ft:hover{background:var(--s2);color:var(--t1)}.ft.on{background:var(--s3)}.ft.fk.on{color:var(--green)}.ft.fv.on{color:var(--red)}.ft.fc.on{color:var(--yel)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
</style>
</head>
<body>
<div class="layout">
  <div class="hdr">
    <button class="sb-toggle" id="sb-toggle" onclick="toggleSb()">☰ <span id="sb-toggle-lbl">Instances</span></button>
    <span class="hdr-title">⚡ Autoweb</span>
    <div class="hdr-meta">
      <span id="h-rate" style="font-weight:600"></span>
      <span><span class="run" id="h-run">0</span> running</span>
      <span><span id="h-tot">0</span> instances</span>
      <span id="h-ts">–</span>
    </div>
  </div>
  <div class="body">
    <div class="sb" id="sb"><div class="empty">Loading…</div></div>
    <div class="det" id="det">
      <div class="empty" id="d-ph">← Select an instance</div>
      <div id="d-in" style="display:none;flex-direction:column;flex:1">
        <div class="dh">
          <button class="det-back" onclick="openSb()">← Back</button>
          <span class="dt" id="d-name"></span>
          <div class="dm"><span id="d-badge"></span><span id="d-stats"></span></div>
        </div>
        <div class="ft-bar" id="d-filt" style="display:none"></div>
        <div class="cur" id="d-cur"></div>
        <table>
          <thead><tr><th>Time</th><th class="sc">Status</th><th>Description</th></tr></thead>
          <tbody id="d-tb"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
let instances=[], sel=null, lastRefresh=null, detFilter=null, detSearch='';
const isMobile=()=>window.innerWidth<=640;
function openSb(){document.querySelector('.body').classList.add('sb-open');document.getElementById('sb-toggle-lbl').textContent='Hide';}
function closeSb(){document.querySelector('.body').classList.remove('sb-open');document.getElementById('sb-toggle-lbl').textContent='Instances';}
function toggleSb(){document.querySelector('.body').classList.contains('sb-open')?closeSb():openSb();}
const ACCENT={feather:'#818cf8',nba:'#fb923c',cli2html:'#22d3ee',premere:'#f472b6',trading:'#4ade80',golf:'#34d399',ria:'#e879f9',cython:'#facc15',alpha:'#38bdf8',backtest:'#fb7185'};
function accent(name){return ACCENT[name]||'#60a5fa';}
function milestone(keeps){
  const steps=[25,50,75,100,150,200,300,400,500,750,1000,1500,2000];
  const next=steps.find(s=>s>keeps)||Math.ceil((keeps+1)/500)*500;
  const prev=steps.filter(s=>s<=keeps).pop()||0;
  const pct=Math.round((keeps-prev)/(next-prev)*100);
  return{next,prev,pct};
}
const e=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fts(ts){
  if(!ts)return'—';
  try{return new Date(ts).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).replace(',','');}
  catch{return ts.slice(0,16)}
}
function ago(ts){
  if(!ts)return'';
  const d=Math.floor((Date.now()-new Date(ts))/1000);
  if(d<60)return d+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';
}
function strip(s){return(s||'').replace(/^Running at \d+:\d+ UTC[^—]*—[^.]*\.\s*Last:\s*/i,'').trim();}
function updateTs(){
  const el=document.getElementById('h-ts');
  if(!lastRefresh){return;}
  const s=Math.floor((Date.now()-lastRefresh)/1000);
  const txt=s<5?'just now':s<60?s+'s ago':Math.floor(s/60)+'m '+Math.floor(s%60)+'s ago';
  const col=s<15?'var(--green)':s<60?'var(--yel)':'var(--red)';
  el.textContent='updated '+txt;el.style.color=col;
}

function renderSb(){
  const runArr=instances.filter(i=>i.running);
  const run=runArr.length;
  const runEl=document.getElementById('h-run');
  if(runArr.length>0&&runArr.length<=3){runEl.innerHTML=runArr.map(i=>`<span style="color:${accent(i.name)};font-weight:600">${e(i.name)}</span>`).join('<span style="color:var(--t3)"> · </span>');}
  else{runEl.textContent=run;}
  document.getElementById('h-tot').textContent=instances.length;
  const totK=instances.reduce((s,i)=>s+i.keeps,0);
  const totAll=instances.reduce((s,i)=>s+i.keeps+i.reverts+i.crashes,0);
  const pct=totAll?Math.round(totK/totAll*100):null;
  const rateEl=document.getElementById('h-rate');
  if(pct!==null){const col=pct>=90?'var(--green)':pct>=70?'var(--yel)':'var(--red)';rateEl.innerHTML=`<span style="color:${col}">${pct}%</span> <span style="color:var(--t3);font-weight:400">${totK} keeps</span>`;}
  else rateEl.textContent='';
  document.title = (pct!==null?pct+'% · ':'')+run+'/'+instances.length+' running · autoweb';
  if(!instances.length){document.getElementById('sb').innerHTML='<div class="empty">No instances</div>';return;}
  document.getElementById('sb').innerHTML=instances.map(i=>{
    const act=strip(i.current), live=i.running&&act.length>3;
    const txt=live?act:(i.last_keep||'');
    const ac=accent(i.name);
    return`<div class="card${sel===i.name?' on':''}${i.running?'':' stopped'}" style="border-left-color:${ac}${i.running?`;box-shadow:0 0 0 1px ${ac}22,0 2px 16px ${ac}18`:''}" onclick="pick('${i.name}')">
      <div class="ch"><span class="cn" style="color:${ac}">${e(i.name)}</span>
        <span class="badge ${i.running?'br':'bs'}">${i.running?'<span class="pulse"></span>running':'stopped'}</span>
        ${!i.running&&i.last_ts?`<span style="font-size:9px;color:var(--t3);margin-left:2px">${ago(i.last_ts)}</span>`:''}</div>
      ${(()=>{const tot=i.keeps+i.reverts+i.crashes;const pct=tot?Math.round(i.keeps/tot*100):null;const col=pct===null?'var(--t3)':pct>=90?'var(--green)':pct>=70?'var(--yel)':'var(--red)';const rv=i.reverts>0?`<span class="r">▼${i.reverts}</span>`:`<span style="color:var(--t3)">▼0</span>`;const cr=i.crashes>0?`<span class="c">✕${i.crashes}</span>`:`<span style="color:var(--t3)">✕0</span>`;return`<div class="cs"><span class="k">▲${i.keeps}</span>${rv}${cr}${pct!==null?`<span class="pct" style="color:${col};background:${col}22">${pct}%</span>`:''}</div>`})()}
      ${(()=>{const rec=i.recent||[];const dots=rec.slice(-10).map(r=>{const c={keep:'#4ade80',revert:'#f87171',crash:'#fbbf24'}[r.status]||'#556070';const tip=[r.status,r.desc?r.desc.slice(0,80).replace(/"/g,''):null,r.ts?ago(r.ts):null].filter(Boolean).join(' · ');return`<span class="sd" style="background:${c}" title="${tip}"></span>`;}).join('');let streak=0;for(let j=rec.length-1;j>=0;j--){if(rec[j].status==='keep')streak++;else break;}const sk=streak>0?`<span style="font-size:9px;color:var(--green);margin-left:4px;font-weight:600">${streak}✓</span>`:'';const today=new Date().toDateString();const todayK=rec.filter(r=>r.status==='keep'&&new Date(r.ts).toDateString()===today).length;const todayLbl=todayK>0?`<span style="font-size:9px;color:var(--green);margin-left:6px;opacity:.65">${todayK} today</span>`:'';return dots?`<div class="sp">${dots}${sk}${todayLbl}</div>`:''})()}
      ${(()=>{const m=milestone(i.keeps);const ac=accent(i.name);return`<div class="ms"><div class="ms-bar"><div class="ms-fill" style="width:${m.pct}%;background:${ac}66"></div></div><span class="ms-lbl">${i.keeps} → ${m.next}</span></div>`})()}
      ${txt?`<div class="cc${live?' live':''}">${e(txt.slice(0,160))}</div>`:''}
    </div>`;
  }).join('');
}

function renderDet(i){
  document.getElementById('d-ph').style.display='none';
  const inn=document.getElementById('d-in');inn.style.display='flex';
  const dn=document.getElementById('d-name');dn.textContent=i.name;dn.style.color=accent(i.name);
  document.getElementById('d-badge').innerHTML=`<span class="badge ${i.running?'br':'bs'}">${i.running?'● running':'stopped'}</span>`;
  const _tot=i.keeps+i.reverts+i.crashes;const _pct=_tot?Math.round(i.keeps/_tot*100):null;
  const _rv=i.reverts>0?`<span style="color:var(--red)">${i.reverts}r</span>`:`<span style="color:var(--t3)">0r</span>`;
  const _cr=i.crashes>0?`<span style="color:var(--yel)">${i.crashes}c</span>`:`<span style="color:var(--t3)">0c</span>`;
  const _pctCol=_pct===null?'var(--t3)':_pct>=90?'var(--green)':_pct>=70?'var(--yel)':'var(--red)';
  document.getElementById('d-stats').innerHTML=`<span style="color:var(--green)">${i.keeps}k</span> · ${_rv} · ${_cr}`+(_pct!==null?` · <span style="color:${_pctCol};font-weight:600">${_pct}%</span>`:'')+( i.last_ts?` · <span style="color:var(--t3)">${ago(i.last_ts)}</span>`:'');
  const cur=document.getElementById('d-cur'), act=strip(i.current);
  if(i.running&&act){cur.textContent='⟳ '+act;cur.classList.add('on');}else cur.classList.remove('on');
  // Build filter tabs
  const rec=i.recent||[];
  const fbar=document.getElementById('d-filt');
  if(rec.length){
    const counts={};rec.forEach(r=>{counts[r.status]=(counts[r.status]||0)+1;});
    const tabs=[{k:'all',label:'all',cls:'',cnt:rec.length},...Object.entries(counts).map(([k,v])=>({k,label:k,cls:'f'+k[0],cnt:v}))];
    fbar.style.display='';
    fbar.innerHTML=tabs.map(t=>`<button class="ft ${t.cls}${detFilter===t.k||(!detFilter&&t.k==='all')?' on':''}" onclick="setDf('${t.k}','${i.name}')">${t.label} <span style="opacity:.55;font-weight:400">${t.cnt}</span></button>`).join('')+`<input id="d-srch" type="text" placeholder="/ to search…" value="${e(detSearch)}" oninput="setDs(this.value,'${i.name}')" style="margin-left:auto;background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:1px 7px;font-size:10px;color:var(--t1);outline:none;width:120px;height:20px" />`;
  } else { fbar.style.display='none'; }

  const tb=document.getElementById('d-tb');
  let rows=(detFilter&&detFilter!=='all')?rec.filter(r=>r.status===detFilter):rec;
  const q=detSearch.trim().toLowerCase();
  if(q)rows=rows.filter(r=>(r.desc||'').toLowerCase().includes(q));
  if(!rows.length){tb.innerHTML='<tr><td colspan="3" class="empty">No matching entries</td></tr>';return;}
  tb.innerHTML=rows.map(r=>{
    const cl={keep:'bk',revert:'bv',crash:'bc'}[r.status]||'bx';
    const rc={keep:'row-k',revert:'row-v',crash:'row-c'}[r.status]||'row-x';
    let descHtml=e(r.desc);
    if(q){const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');descHtml=e(r.desc).replace(re,'<mark style="background:#fbbf2433;color:var(--yel);border-radius:2px">$1</mark>');}
    return`<tr class="${rc}"><td class="ts">${fts(r.ts)}<br><span style="font-size:9px;color:var(--t3)">${ago(r.ts)}</span></td><td class="sc"><span class="badge ${cl}">${r.status}</span></td><td><span class="desc">${descHtml}</span></td></tr>`;
  }).join('');
}

function setDf(f,name){
  detFilter=f==='all'?null:f;
  const i=instances.find(x=>x.name===name);if(i)renderDet(i);
}
function setDs(v,name){
  detSearch=v;
  const i=instances.find(x=>x.name===name);if(i)renderDet(i);
  // restore focus/cursor in input after re-render
  const inp=document.getElementById('d-srch');if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}
}
function pick(name){
  if(name!==sel){detFilter=null;detSearch='';}
  sel=name;renderSb();
  const i=instances.find(x=>x.name===name);if(i)renderDet(i);
  if(isMobile())closeSb();
}

async function refresh(){
  try{
    const data=await fetch('/aw/instances.json?_='+Date.now()).then(r=>r.json());
    instances=data.sort((a,b)=>b.running-a.running||b.keeps-a.keeps);
    lastRefresh=Date.now();renderSb();
    if(sel){const i=instances.find(x=>x.name===sel);if(i)renderDet(i);}
    updateTs();
  }catch(err){document.getElementById('h-ts').textContent='error';document.getElementById('h-ts').style.color='var(--red)';}
}

async function init(){
  if(isMobile())openSb();
  await refresh();
  if(!sel&&instances.length){
    if(isMobile()){pick((instances.find(i=>i.running)||instances[0]).name);openSb();}
    else pick((instances.find(i=>i.running)||instances[0]).name);
  }
}
document.addEventListener('keydown',e=>{
  if(!instances.length)return;
  const inInput=e.target.tagName==='INPUT';
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(inInput)return;
    e.preventDefault();
    const idx=instances.findIndex(x=>x.name===sel);
    const next=(e.key==='ArrowDown')
      ?Math.min(instances.length-1,idx<0?0:idx+1)
      :Math.max(0,idx<0?0:idx-1);
    pick(instances[next].name);
    // scroll card into view
    const cards=document.querySelectorAll('.card');
    if(cards[next])cards[next].scrollIntoView({block:'nearest'});
  }
  if(e.key==='/'&&!inInput){
    e.preventDefault();
    const inp=document.getElementById('d-srch');
    if(inp){inp.focus();inp.select();}
  }
  if(e.key==='Escape'){
    const inp=document.getElementById('d-srch');
    if(inp&&document.activeElement===inp){inp.blur();}
    if(detSearch){detSearch='';if(sel){const i=instances.find(x=>x.name===sel);if(i)renderDet(i);}}
  }
});
init();setInterval(refresh,5000);setInterval(updateTs,1000);
</script>
</body>
</html>
